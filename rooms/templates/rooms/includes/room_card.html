<article class="card room-card h-100">
    {% if room.photo %}
        <img class="card-img-top room-photo-thumb" src="{{ room.photo.url }}" alt="{{ room.name }}">
    {% endif %}
    <div class="card-body">
        <h2 class="h5 card-title">{{ room.name|default:"Без названия" }}</h2>
        <p class="card-text mb-1">Размер: {{ room.size }}</p>
        <p class="card-text">Тариф: {{ room.price_per_night }} ₽ в сутки</p>
        <a class="btn btn-outline-primary btn-sm"
           href="{{ room.get_absolute_url }}">Подробнее</a>
    </div>
</article>
