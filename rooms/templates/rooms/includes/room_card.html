<article class="card room-card h-100">
    <div class="card-body">
        <h2 class="h5 card-title">{{ room.name|default:"Без названия" }}</h2>
        <p class="card-text mb-1">Размер: {{ room.size }}</p>
        <p class="card-text">Тариф: {{ room.price_per_night }} ₽ в сутки</p>
        <a class="btn btn-outline-primary btn-sm"
           href="{% url 'rooms:detail' room.id %}">Подробнее</a>
    </div>
</article>
