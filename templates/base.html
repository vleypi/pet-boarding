{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ site_name }}{% endblock %}</title>
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    >
    <link rel="stylesheet" href="{% static 'homepage/css/style.css' %}">
</head>
<body>
    {% include "includes/navigation.html" %}

    <main class="container pb-5">
        {% for message in messages %}
            <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %}" role="alert">{{ message }}</div>
        {% endfor %}
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer container py-3">
        © <span id="current-year"></span> {{ site_name }}: гостиница для кошек и собак
    </footer>

    <script src="{% static 'homepage/js/main.js' %}"></script>
</body>
</html>
